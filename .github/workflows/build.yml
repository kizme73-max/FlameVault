name: Build FlameVault VST3

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Get WebView2 SDK
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2739.15 -OutputDirectory "${{ github.workspace }}/webview2"
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/webview2"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $out = "build/FlameVault_artefacts/Release"
          Get-ChildItem -Recurse $out | Select-Object -First 40 FullName
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$out/VST3/FlameVault.vst3" -DestinationPath dist/FlameVault-VST3-win64.zip
          Compress-Archive -Path "$out/Standalone/FlameVault.exe" -DestinationPath dist/FlameVault-Standalone-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FlameVault-win64
          path: dist/*.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
