  fillAll();$('#synN').textContent=known.length+' samples';nav();list();insp();ui()});
 load();HOST.on('library',load);
 HOST.on('scan',d=>{const pct=d.scanning?Math.round(100*d.done/Math.max(1,d.total)):100;$('#scT').textContent=d.scanning?'Scanning…':'Idle';$('#scS').textContent=d.scanning?pct+'% • '+d.done+' files':'All folders scanned';document.querySelector('.ring').style.background='conic-gradient(var(--o) '+pct+'%,#3a2a1a 0)'});
}
